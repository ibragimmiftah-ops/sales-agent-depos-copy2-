[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF", "TC"]
ignore = ["B008", "B904", "B905", "RUF001", "TC001", "TC002", "TC003", "TC005", "UP017", "UP042"]

[tool.ruff.lint.per-file-ignores]
"app/agent/agent.py" = ["BLE001", "E501"]
"app/agent/prompts.py" = ["E501"]
"app/api/health.py" = ["BLE001"]
"app/main.py" = ["BLE001"]
"app/memory/short_term.py" = ["BLE001"]
"app/services/llm.py" = ["BLE001", "E501"]
"app/tools/base.py" = ["BLE001"]
"tests/**/*" = ["BLE001", "S", "E501"]
