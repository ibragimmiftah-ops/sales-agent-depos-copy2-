# Configurable lead scoring for AI Sales Agent.
# Weights can be tuned without touching business logic.

criteria:
  business_need:
    clear_problem: 20
    general_interest: 5
    none: 0
  budget:
    suitable: 20
    unknown: 5
    insufficient: -10
  urgency:
    now: 15
    one_to_three_months: 10
    someday: 0
  authority:
    decision_maker: 15
    influencer: 8
    none: 0
  company_fit:
    good: 15
    partial: 7
    none: 0
  volume:
    high: 15
    medium: 8
    low: 2

thresholds:
  low: 39
  potential: 69

# Budget strings considered insufficient / suitable (case-insensitive)
budget:
  insufficient: ["<5k", "5k-10k", "до 5000", "до 10000", "10 000", "5 тыс"]
  suitable: ["20k+", "50k+", "100k+", "20 000+", "50 000+", "100 000+", "от 20000"]

# Urgency keyword matching (case-insensitive, Russian + English)
urgency:
  now: ["срочно", "нужно сейчас", "asap", "now", "немедленно", "прямо сейс", "этот месяц"]
  one_to_three_months: ["1-3 месяца", "через месяц", "в этом квартале", "1-3 months", "next quarter"]

# Industry fit (case-insensitive substring match)
company_fit:
  good:
    - ecommerce
    - internet-магазин
    - интернет-магазин
    - dentistry
    - стоматология
    - real estate
    - недвижимость
    - saas
    - b2b
    - retail
    - ритейл
    - fintech
    - edtech
    - logistics
    - логистика
  partial:
    - other
    - другая
    - consulting
    - консалтинг

volume:
  high: 1000
  medium: 200
